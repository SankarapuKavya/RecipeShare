{% extends 'base.html' %}

{% block title %}
Edit Profile - RecipeShare
{% endblock %}

{% block content %}

<h1>✏️ Edit Profile</h1>

<form method="POST">

    {% csrf_token %}

    <label for="username">
        Username:
    </label>

    <br>

    <input
        type="text"
        id="username"
        name="username"
        value="{{ user.username }}"
        required
    >

    <br><br>


    <label for="email">
        Email:
    </label>

    <br>

    <input
        type="email"
        id="email"
        name="email"
        value="{{ user.email }}"
    >

    <br><br>


    <button type="submit">
        Save Changes
    </button>

</form>

<br>

<a href="{% url 'profile' %}">
    ← Back to Profile
</a>

{% endblock %}
