{% extends 'base.html' %}

{% block title %}
Add Recipe - RecipeShare
{% endblock %}

{% block content %}

<h1>➕ Add New Recipe</h1>

<form
    method="POST"
    enctype="multipart/form-data"
>

    {% csrf_token %}


    <label for="title">
        Recipe Title:
    </label>

    <br>

    <input
        type="text"
        id="title"
        name="title"
        placeholder="Enter recipe title"
        required
    >

    <br><br>


    <label for="description">
        Description:
    </label>

    <br>

    <textarea
        id="description"
        name="description"
        rows="5"
        placeholder="Describe your recipe..."
        required
    ></textarea>

    <br><br>


    <label for="ingredients">
        Ingredients:
    </label>

    <br>

    <textarea
        id="ingredients"
        name="ingredients"
        rows="8"
        placeholder="List your ingredients..."
        required
    ></textarea>

    <br><br>


    <label for="instructions">
        Instructions:
    </label>

    <br>

    <textarea
        id="instructions"
        name="instructions"
        rows="8"
        placeholder="Explain how to prepare the recipe..."
        required
    ></textarea>

    <br><br>


    <label for="category">
        Category:
    </label>

    <br>

    <select
        id="category"
        name="category"
        required
    >

        <option value="">
            Select a category
        </option>

        {% for category in categories %}

            <option value="{{ category.id }}">
                {{ category.name }}
            </option>

        {% endfor %}

    </select>

    <br><br>


    <label for="image">
        Recipe Image:
    </label>

    <br>

    <input
        type="file"
        id="image"
        name="image"
        accept="image/jpeg,image/png,image/webp"
    >

    <br>

    <small>
        Optional. JPG, PNG, or WEBP. Maximum 5 MB.
    </small>

    <br><br>


    <button type="submit">
        Add Recipe
    </button>

</form>

<br>

<a href="{% url 'my_recipes' %}">
    ← Back to My Recipes
</a>

{% endblock %}
